# Render blueprint for the RidgeVia Health site: a Vite build published as a static site.
# The live service is named "RidgeVia" and deploys the main branch of ridgeviallc-source/RidgeVia.
# Its build settings must match this file: the build command below, and dist as the publish path.
services:
  - type: web
    name: RidgeVia
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
